[package]
name = "algorithms-rs"
version = "0.1.0"
edition = "2021"
description = "Rust search-core primitives ported from the Python AlphaZero implementation"
license = "MIT"

[lib]
name = "algorithms_rs"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.25", features = ["extension-module"] }

[dev-dependencies]
