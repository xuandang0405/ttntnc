[package]
name = "algorithms-rs"
version = "0.2.0"
edition = "2021"
description = "Rust AlphaZero search: chess rules, encoding and batched MCTS in native code"
license = "MIT"

[lib]
name = "algorithms_rs"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
# `extension-module` must be off for `cargo test` (links libpython); maturin enables it.
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = "0.25"
numpy = "0.25"
shakmaty = "0.27"
rayon = "1"
rand = "0.8"
rand_distr = "0.4"
half = "2"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
