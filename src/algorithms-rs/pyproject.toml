[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "algorithms-rs"
version = "0.2.0"
requires-python = ">=3.10"
description = "Native Rust AlphaZero search for the chess application"

[tool.maturin]
bindings = "pyo3"
module-name = "algorithms_rs"
features = ["extension-module"]
